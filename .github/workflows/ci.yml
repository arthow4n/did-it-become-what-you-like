name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check formatting
        run: deno task fmt:check
      - name: Lint
        run: deno task lint
      - name: Type-check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Build
        run: deno task build
      - name: Verify Pages artifact and routing
        run: deno task verify:pages
      - name: Verify CI policy
        run: deno task verify:ci
