name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with:
          deno-version: v2.9.5
      - name: Check formatting
        run: deno task fmt:check
      - name: Lint
        run: deno task lint
      - name: Type-check
        run: deno task check
      - name: Test
        run: deno task test
      - name: Build
        run: deno task build
      - name: Verify Pages artifact and routing
        run: deno task verify:pages
      - name: Verify release artifact provenance and notices
        run: deno task release:verify
      - name: Verify CI policy
        run: deno task verify:ci
